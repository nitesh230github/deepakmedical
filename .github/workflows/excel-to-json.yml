name: Excel to JSON

on:
  push:
    paths:
      - "products.xlsx"
      - "scripts/updated_data_excel_to_json.py"
      - "scripts/build_product_pages.py"
  workflow_dispatch:   # Actions tab se manually bhi chala sakte ho

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: Excel se JSON banao
        run: python scripts/updated_data_excel_to_json.py

      # Har product ka alag page (medicine/<naam>/) + sitemap.xml banao,
      # aur products.json me har product ka "url" jodo
      - name: Product pages banao
        run: python scripts/build_product_pages.py

      - name: Change ho to commit karo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A: hataye gaye products ke purane pages bhi repo se hat jaayen
          git add -A products.json sitemap.xml medicine
          if git diff --cached --quiet; then
            echo "Koi change nahi"
          else
            git commit -m "Auto-update products.json and product pages from Excel"
            git push
          fi
