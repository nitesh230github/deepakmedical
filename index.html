<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Deepak Medical Agency</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <!-- Top Row -->
    <div class="header-top">

        <div class="logo-section">
            <img src="images/website_images/logo.png" class="logo">
            <div class="brand">
                <h1>Deepak Medical Agency</h1>
                <p>सही दवा💊 सही दाम💰 FREE & FAST Delivery🚚</p>
            </div>
        </div>

        <a href="https://medicalstorewala.vercel.app/"
         target="_blank"
         rel="noopener noreferrer"
         class="radio-icon"
             title="Listen Live">
             📻
          <span class="radio-pulse"></span>
        </a>

        <div class="search-cart">
          <input type="text" id="search" class="search-box" placeholder="🔍 Search Medicines...">
        <div id="cartButton">🛒 Cart (0)</div>
    </div>

</div>


    <!-- Bottom Row -->

    <div class="header-bottom">

        <select id="categoryFilter">

            <option value="ALL">📂 All </option>
            <option value="TABLET_CAP">💊 Tablets</option>
            <option value="LIQUID">🧴 Syrups</option>
            <option value="CREAM_OINT">🧴 Creams</option>
            <option value="DROP">👁‍🗨 Drops</option>
            <option value="OTHERS">📦 Others</option>

        </select>

        <button class="cat-btn active" onclick="selectCategory('ALL',this)"> 📂 All </button> 

        <button class="cat-btn"
        onclick="selectCategory('TABLET_CAP',this)">
            💊 Tablets
        </button>

        <button class="cat-btn"
        onclick="selectCategory('LIQUID',this)">
            🧴 Syrups
        </button>

        <button class="cat-btn"
        onclick="selectCategory('CREAM_OINT',this)">
            🧴 Creams
         </button>

        <button class="cat-btn"
        onclick="selectCategory('DROP',this)">
            👁 Drops
        </button>
         <!---   
        <button class="cat-btn"
        onclick="selectCategory('OINTMENT',this)">
            🩹 Ointment
        </button>    -->

        <button class="cat-btn"
        onclick="selectCategory('OTHERS',this)">
            📦 Others
        </button>

    </div>

</header>

</html>
