<!DOCTYPE html>
<!-- lang="en-IN": Google ko batata hai ki site India ke liye hai -->
<html lang="en-IN">

<head>

    <!-- =====================================================
         1. BASIC SETTINGS
         ===================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Search Console verification (isko mat hatana, warna verification toot jayega) -->
    <meta name="google-site-verification" content="bP2ZQSnXWnFK7as2zfLtir3p8HBD09xhsLlbXhtNBjo">


    <!-- =====================================================
         2. SEO (Google Search ke liye)
         ===================================================== -->
    <title>Deepak Medical Agency, Rewa | Wholesale Medicines & Free Delivery</title>

    <!-- Description: Google result me title ke neeche dikhta hai (150-160 characters ke andar rakho) -->
    <meta name="description" content="Deepak Medical Agency, Rewa & Mauganj. Sahi dawa, Sahi daam, Free & Fast Delivery.">

    <!-- Google ko batata hai ki ye page index karna hai -->
    <meta name="robots" content="index, follow">

    <!-- Canonical: asli URL batata hai (duplicate URLs se bachata hai) -->
    <link rel="canonical" href="https://deepakmedical.vercel.app/">


    <!-- =====================================================
         3. ICONS (Favicon)
         Logo square hona chahiye (kam se kam 48x48 px, behtar 192x192)
         ===================================================== -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">

    <!-- TODO: /apple-touch-icon.png file repo me nahi hai (404 aa raha tha).
         Jab 180x180 px ki PNG bana ke root folder me daalo, tab niche wali line uncomment karo.
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    -->


    <!-- =====================================================
         4. SOCIAL SHARING (Open Graph)
         WhatsApp / Facebook par link share karne par title, description aur logo dikhta hai
         ===================================================== -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Deepak Medical Agency, Rewa">
    <meta property="og:title" content="Deepak Medical Agency | Online Medical Store">
    <meta property="og:description" content="Sahi dawa, Sahi daam. Free & Fast Delivery.">
    <meta property="og:url" content="https://deepakmedical.vercel.app/">
    <meta property="og:image" content="https://deepakmedical.vercel.app/images/website_images/logo.png">


    <!-- =====================================================
         5. STRUCTURED DATA (Schema) - sirf Google ke liye, visitors ko dikhta nahi
         ===================================================== -->

    <!-- Schema 1 (WebSite): Google result me "Vercel" ki jagah "Deepak Medical Agency" naam dikhane me madad karta hai -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Deepak Medical Agency, Rewa",
      "alternateName": [
        "Deepak Medical Agency Rewa",
        "Deepak Medical and Surgical Agency",
        "Deepak Medical Agency Mauganj",
        "Deepak Medical Mauganj"
      ],
      "url": "https://deepakmedical.vercel.app/"
    }
    </script>

    <!-- Schema 2 (Pharmacy): Google ko dukan ka address, timing, phone aur social links batata hai.
         Address / phone badalna ho to yahin badlo (aur neeche footer me bhi). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Pharmacy",
      "name": "Deepak Medical Agency",
      "url": "https://deepakmedical.vercel.app/",
      "image": "https://deepakmedical.vercel.app/images/website_images/logo.png",
      "telephone": "+917804008789",
      "priceRange": "₹",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Chirahula Mandir",
        "addressLocality": "Rewa",
        "postalCode": "486001",
        "addressRegion": "MP",
        "addressCountry": "IN"
      },
      "openingHours": "Mo-Su 09:00-21:00",
      "sameAs": [
        "https://www.facebook.com/share/1DoJ9zAbfs/",
        "https://www.instagram.com/deepakmedagency/"
      ]
    }
    </script>


    <!-- =====================================================
         6. FONTS & STYLES
         ===================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>

<!-- =========================================================
     HEADER
     Upar wali row: logo, radio, search, contact, cart
     Neeche wali row: category filter (dropdown + buttons)
     ========================================================= -->
<header>

    <!-- ---------- Top Row ---------- -->
    <div class="header-top">

        <!-- Logo + Brand name -->
        <div class="logo-section">
            <img src="images/website_images/logo.png" class="logo" alt="Deepak Medical Agency logo">
            <div class="brand">
                <!-- Main H1: Google ke liye sabse important. Poore page par sirf EK h1 rakhna -->
                <h1>Deepak Medical Agency</h1>
                <p>सही दवा💊 सही दाम💰 FREE & FAST Delivery🚚</p>
            </div>
        </div>

        <!-- Radio icon: dusri website (medicalstorewala) naye tab me kholta hai -->
        <a href="https://medicalstorewala.vercel.app/"
           target="_blank"
           rel="noopener noreferrer"
           class="radio-icon"
           title="Listen Live"
           aria-label="Listen Live">
            📻
            <span class="radio-pulse"></span>
        </a>

        <!-- Search + Contact + Cart -->
        <div class="search-cart">

            <!-- Search box (script.js isko id="search" se pakadta hai) -->
            <input type="text" id="search" class="search-box" placeholder="🔍 Search Medicines..." aria-label="Search Medicines">

            <!-- Contact Us: click par page ke neeche footer (id="contact") tak smooth scroll hota hai -->
            <a href="#contact" class="contact-btn" aria-label="Contact Us">
                <span class="contact-icon">📞</span>
                <span class="contact-text">Contact Us</span>
            </a>

            <!-- Cart button (script.js isko id="cartButton" se pakadta hai, count yahin update hota hai) -->
            <div id="cartButton">🛒 Cart (0)</div>

        </div>

    </div>


    <!-- ---------- Bottom Row: Category filter ---------- -->
    <div class="header-bottom">

        <!-- Dropdown: style.css isko screen par chhupa deta hai (sirf script.js ke liye).
             script.js isme current category yaad rakhta hai. Hatana mat. -->
        <select id="categoryFilter" aria-label="Category">
            <option value="ALL">📂 All</option>
            <option value="TABLET_CAP">💊 Tablets</option>
            <option value="LIQUID">🧴 Syrups</option>
            <option value="CREAM_OINT">🧴 Creams</option>
            <option value="DROP">👁 Drops</option>
            <option value="OTHERS">📦 Others</option>
        </select>

        <!-- Category buttons (desktop + mobile dono par yahi dikhte hain).
             data-category ki value upar dropdown ki value se match honi chahiye.
             Click ka kaam script.js karta hai (inline onclick nahi). -->
        <button class="cat-btn active" data-category="ALL">📂 All</button>
        <button class="cat-btn" data-category="TABLET_CAP">💊 Tablets</button>
        <button class="cat-btn" data-category="LIQUID">🧴 Syrups</button>
        <button class="cat-btn" data-category="CREAM_OINT">🧴 Creams</button>
        <button class="cat-btn" data-category="DROP">👁 Drops</button>
        <button class="cat-btn" data-category="OTHERS">📦 Others</button>

    </div>

</header>


<!-- =========================================================
     OPTIONAL: Image Slider (abhi band hai)
     Chalu karna ho to niche ka comment hata do aur style.css / script.js me slider ka code bhi check karo.

<div class="slider">
    <button class="prev">&#10094;</button>
    <div class="slides">
        <img src="images/website_images/slider1.jpg" alt="Slider 1">
        <img src="images/website_images/slider2.jpg" alt="Slider 2">
        <img src="images/website_images/slider3.jpg" alt="Slider 3">
    </div>
    <button class="next">&#10095;</button>
</div>
     ========================================================= -->


<!-- =========================================================
     MAIN CONTENT
     Dono khaali div ko script.js bharta hai:
       #products  -> products.json se medicine cards
       #cartArea  -> cart ka content
     ========================================================= -->
<main>
    <div id="products"></div>

    <!-- Infinite scroll: list ke neeche ghumta spinner. Dikhne par agle 24 products load hote hain.
         (script.js ise "active" class se dikhata/chhupata hai) -->
    <div id="loadMore" class="load-more" role="status" aria-label="Loading more products">
        <div class="spinner"></div>
    </div>

    <div id="cartArea"></div>
</main>


<!-- =========================================================
     FOOTER (Visitors ko dikhne wali details)
     "Contact Us" button yahin (id="contact") tak scroll karta hai.
     ========================================================= -->
<footer class="site-footer" id="contact">

    <h2>Deepak Medical Agency</h2>

    <p>Wholesale Supply of Medicines & OTC Products in Rewa & Mauganj with FREE delivery.</p>

    <!-- Address / Phone / Timing: abhi band hain.
         Dikhana ho to niche ka comment hata do (phone number schema wala hi bhar diya hai).

    <p>📍 <strong>Address:</strong> Chirahula Mandir, Rewa, Madhya Pradesh</p>
    <p>📞 <strong>Phone:</strong> <a href="tel:+917804008789">+91 78040 08789</a></p>
    <p>🕘 <strong>Timing:</strong> Subah 9:00 baje se raat 9:00 baje tak (Sabhi din)</p>
    -->

    <!-- Social media icons (SVG files: images/social/) -->
    <div class="social-icons">

        <a href="https://www.facebook.com/share/1DoJ9zAbfs/" target="_blank" rel="noopener noreferrer"
           class="social-icon facebook" aria-label="Facebook" title="Facebook">
            <img src="images/social/facebook.svg" alt="Facebook" width="48" height="48" loading="lazy">
        </a>

        <a href="https://www.instagram.com/deepakmedagency/" target="_blank" rel="noopener noreferrer"
           class="social-icon instagram" aria-label="Instagram" title="Instagram">
            <img src="images/social/instagram.svg" alt="Instagram" width="48" height="48" loading="lazy">
        </a>

        <a href="https://wa.me/917804008789" target="_blank" rel="noopener noreferrer"
           class="social-icon whatsapp" aria-label="WhatsApp" title="WhatsApp par chat karein">
            <img src="images/social/whatsapp.svg" alt="WhatsApp" width="48" height="48" loading="lazy">
        </a>

    </div>

    <p class="copyright">© 2026 Deepak Medical Agency. All rights reserved.</p>

</footer>


<!-- Saari functionality yahan se chalti hai (body ke end me, taaki page pehle load ho) -->
<script src="script.js"></script>

</body>
</html>
