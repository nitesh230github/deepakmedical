name: Excel to JSON

on:
  push:
    paths:
      - "products.xlsx"
      - "scripts/excel_to_json.py"
  workflow_dispatch:   # Actions tab se manually bhi chala sakte ho

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: Excel se JSON banao
        run: python scripts/excel_to_json.py

      - name: Change ho to commit karo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "JSON me koi change nahi"
          else
            git commit -m "Auto-update products.json from Excel"
            git push
          fi
